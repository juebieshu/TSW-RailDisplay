name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Build, check and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # 推送和 PR 构建 Release；手动触发构建 Debug（发布包附带 Debug.dll 插件）。
      BUILD_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && 'Debug' || 'Release' }}
      RUNTIME_ID: win-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore RailDisplay.sln -p:Configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Build solution (${{ env.BUILD_CONFIGURATION }})
        run: dotnet build RailDisplay.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run Core checks
        run: dotnet run --project checks/Core/CoreChecks.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build

      - name: Run application checks
        run: dotnet run --project checks/CtcsChecks.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build

      - name: Publish single-file app (${{ env.RUNTIME_ID }})
        shell: pwsh
        run: |
          $version = (dotnet msbuild RailDisplay/RailDisplay.csproj -getProperty:InformationalVersion -p:Configuration=$env:BUILD_CONFIGURATION).Trim()
          if (!$version) { throw 'Could not read InformationalVersion.' }
          $packageName = "RailDisplay-$version-$env:RUNTIME_ID"
          $packageDirectory = Join-Path $env:RUNNER_TEMP $packageName
          $archive = Join-Path $env:GITHUB_WORKSPACE "$packageName.zip"
          dotnet publish RailDisplay/RailDisplay.csproj --configuration $env:BUILD_CONFIGURATION --runtime $env:RUNTIME_ID --self-contained false --output $packageDirectory -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path $packageDirectory -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: RailDisplay-${{ env.RUNTIME_ID }}-${{ env.BUILD_CONFIGURATION }}
          path: RailDisplay-*.zip
          if-no-files-found: error
          retention-days: 14
